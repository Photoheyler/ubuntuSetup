version: "3.9"

services:
  app:
    image: ghcr.io/your-org/your-app:latest
    container_name: your-app
    restart: unless-stopped
    network_mode: host
    runtime: nvidia
    environment:
      TZ: Europe/Berlin
    volumes:
      - /var/log/your-app:/app/logs
    healthcheck:
      test: ["CMD", "bash", "-lc", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
